<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wikipedia Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; color: #111; }

    /* Tabs */
    #tab-bar { display: flex; border-bottom: 2px solid #e0e0e0; background: #fafafa; padding: 0 24px; }
    .tab { padding: 12px 20px; cursor: pointer; font-size: 0.95rem; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab:hover { color: #111; }
    .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; font-weight: 600; }

    /* Panels */
    .panel { display: none; flex: 1; overflow: hidden; }
    .panel.active { display: flex; flex-direction: column; }

    /* Chat panel */
    #chat-panel { padding: 32px 24px; max-width: 760px; width: 100%; margin: 0 auto; flex-direction: column; overflow-y: auto; }
    h1 { font-size: 1.3rem; margin-bottom: 24px; }
    #form { display: flex; gap: 8px; }
    #query { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 18px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #aaa; cursor: default; }
    #status { margin-top: 8px; font-size: 0.85rem; color: #666; }
    #result { margin-top: 24px; }
    #answer { background: #f4f4f4; border-radius: 6px; padding: 16px; white-space: pre-wrap; line-height: 1.6; }
    .view-trace-btn { display: inline-block; margin-top: 12px; color: #1a73e8; font-size: 0.9rem; cursor: pointer; background: none; border: none; padding: 0; text-decoration: underline; }
    #chat-error { background: #fdecea; border: 1px solid #f5c6cb; border-radius: 6px; padding: 16px; color: #721c24; }

    /* Traces panel */
    #traces-panel { flex-direction: row; overflow: hidden; }
    #sidebar { width: 280px; min-width: 200px; border-right: 1px solid #ddd; overflow-y: auto; background: #fafafa; flex-shrink: 0; }
    #sidebar h2 { padding: 16px; font-size: 0.9rem; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    #refresh-btn, .refresh-btn { font-size: 0.75rem; background: none; border: 1px solid #ccc; border-radius: 4px; padding: 2px 8px; color: #555; cursor: pointer; }
    .session-item { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
    .session-item:hover { background: #f0f0f0; }
    .session-item.active { background: #e8f0fe; }
    .session-id { font-size: 0.8rem; color: #555; font-family: monospace; }
    .session-meta { font-size: 0.75rem; color: #888; margin-top: 4px; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; margin-left: 6px; }
    .badge-success { background: #d4edda; color: #155724; }
    .badge-blocked { background: #fff3cd; color: #856404; }
    .badge-error { background: #fdecea; color: #721c24; }

    #trace-main { flex: 1; overflow-y: auto; padding: 24px; }
    #summary { background: #f4f4f4; border-radius: 8px; padding: 16px; margin-bottom: 20px; display: flex; gap: 24px; flex-wrap: wrap; }
    .summary-item { font-size: 0.85rem; }
    .summary-label { color: #666; font-size: 0.75rem; }
    .summary-value { font-weight: 600; }

    .event-card { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .event-header { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
    .event-header:hover { filter: brightness(0.97); }
    .event-name { font-weight: 600; font-size: 0.88rem; }
    .event-turn { font-size: 0.73rem; color: #666; background: rgba(0,0,0,0.07); padding: 1px 6px; border-radius: 8px; }
    .event-ts { font-size: 0.73rem; color: #999; margin-left: auto; }
    .duration-badge { font-size: 0.72rem; padding: 1px 7px; border-radius: 10px; background: rgba(0,0,0,0.08); }
    .event-body { padding: 0 14px 12px; display: none; }
    .event-body.open { display: block; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 0.77rem; line-height: 1.5; white-space: pre-wrap; word-break: break-all; margin-top: 8px; }
    .toggle-raw { font-size: 0.75rem; color: #1a73e8; cursor: pointer; }

    .color-safety  { background: #fffde7; border-color: #f9a825; }
    .color-llm     { background: #e3f2fd; border-color: #1565c0; }
    .color-tool    { background: #e8f5e9; border-color: #2e7d32; }
    .color-error   { background: #fdecea; border-color: #c62828; }
    .color-final   { background: #f5f5f5; border-color: #9e9e9e; }

    #trace-empty { color: #999; font-size: 0.9rem; padding: 60px; text-align: center; }

    /* Evals panel */
    #evals-panel { flex-direction: row; overflow: hidden; }
    #evals-sidebar { width: 280px; min-width: 200px; border-right: 1px solid #ddd; overflow-y: auto; background: #fafafa; flex-shrink: 0; }
    #evals-sidebar h2 { padding: 16px; font-size: 0.9rem; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    .run-item { padding: 12px 16px; border-bottom: 1px solid #eee; cursor: pointer; }
    .run-item:hover { background: #f0f0f0; }
    .run-item.active { background: #e8f0fe; }
    .run-id { font-size: 0.8rem; color: #555; font-family: monospace; }
    .run-meta { font-size: 0.75rem; color: #888; margin-top: 4px; }
    .badge-pass { background: #d4edda; color: #155724; }
    .badge-fail { background: #fdecea; color: #721c24; }

    #evals-main { flex: 1; overflow-y: auto; padding: 24px; }
    #evals-empty { color: #999; font-size: 0.9rem; padding: 60px; text-align: center; }

    .run-summary { background: #f4f4f4; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    .run-summary-top { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .judge-table { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .judge-cell { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; padding: 8px 10px; font-size: 0.8rem; }
    .judge-cell-name { color: #666; font-size: 0.72rem; margin-bottom: 2px; }
    .judge-cell-stat { font-weight: 600; }

    .case-card { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
    .case-card.verdict-pass { border-left: 3px solid #28a745; }
    .case-card.verdict-fail { border-left: 3px solid #dc3545; }
    .case-header { padding: 10px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; background: #fafafa; }
    .case-header:hover { background: #f0f0f0; }
    .case-id { font-size: 0.78rem; font-family: monospace; color: #555; flex-shrink: 0; }
    .case-query { font-size: 0.85rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .case-failures { font-size: 0.72rem; color: #dc3545; flex-shrink: 0; }
    .case-body { display: none; padding: 12px 14px; border-top: 1px solid #eee; }
    .case-body.open { display: block; }

    .judge-section { margin-bottom: 12px; }
    .judge-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.82rem; font-weight: 600; }
    .rubric-row { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid #f0f0f0; }
    .rubric-row:last-child { border-bottom: none; }
    .rubric-name { font-family: monospace; font-size: 0.75rem; color: #555; flex-shrink: 0; width: 180px; }
    .rubric-chip { font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 10px; flex-shrink: 0; }
    .chip-pass { background: #d4edda; color: #155724; }
    .chip-fail { background: #fdecea; color: #721c24; }
    .rubric-reason { color: #555; flex: 1; }

    .agent-response-toggle { font-size: 0.75rem; color: #1a73e8; cursor: pointer; margin-bottom: 8px; display: inline-block; }
    .agent-response-box { background: #f4f4f4; border-radius: 6px; padding: 12px; font-size: 0.8rem; white-space: pre-wrap; line-height: 1.5; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>

  <div id="tab-bar">
    <div class="tab active" data-tab="chat" onclick="switchTab('chat')">Chat</div>
    <div class="tab" data-tab="traces" onclick="switchTab('traces')">Traces</div>
    <div class="tab" data-tab="evals" onclick="switchTab('evals')">Evals</div>
  </div>

  <!-- Chat Panel -->
  <div id="chat-panel" class="panel active">
    <h1>Wikipedia Agent</h1>
    <form id="form">
      <input id="query" type="text" placeholder="Ask a question…" autocomplete="off" required />
      <button id="submit-btn" type="submit">Ask</button>
    </form>
    <div id="status"></div>
    <div id="result" style="display:none;"></div>
  </div>

  <!-- Evals Panel -->
  <div id="evals-panel" class="panel">
    <div id="evals-sidebar">
      <h2>Eval Runs <button id="evals-refresh-btn" class="refresh-btn" onclick="loadEvalRuns()">↻ Refresh</button></h2>
      <div id="run-list"><p style="padding:16px;font-size:0.85rem;color:#888;">Loading…</p></div>
    </div>
    <div id="evals-main">
      <div id="evals-view"><p id="evals-empty">Select an eval run to view results.</p></div>
    </div>
  </div>

  <!-- Traces Panel -->
  <div id="traces-panel" class="panel">
    <div id="sidebar">
      <h2>Sessions <button id="refresh-btn" onclick="loadSessions()">↻ Refresh</button></h2>
      <div id="session-list"><p style="padding:16px;font-size:0.85rem;color:#888;">Loading…</p></div>
    </div>
    <div id="trace-main">
      <div id="trace-view"><p id="trace-empty">Select a session to view its trace.</p></div>
    </div>
  </div>

  <script>
    // ── Tab switching ──────────────────────────────────────────────
    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      document.getElementById('chat-panel').classList.toggle('active', name === 'chat');
      document.getElementById('traces-panel').classList.toggle('active', name === 'traces');
      document.getElementById('evals-panel').classList.toggle('active', name === 'evals');
      if (name === 'traces') loadSessions();
      if (name === 'evals') loadEvalRuns();
    }

    // ── Chat ──────────────────────────────────────────────────────
    const form = document.getElementById('form');
    const queryInput = document.getElementById('query');
    const submitBtn = document.getElementById('submit-btn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = queryInput.value.trim();
      if (!query) return;

      submitBtn.disabled = true;
      statusEl.textContent = 'Thinking…';
      resultEl.style.display = 'none';
      resultEl.innerHTML = '';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query }),
        });
        const data = await res.json();
        resultEl.style.display = 'block';
        statusEl.textContent = '';

        if (data.status === 'success') {
          resultEl.innerHTML = `
            <div id="answer">${escapeHtml(data.answer)}</div>
            <button class="view-trace-btn" onclick="openTrace('${data.session_id}')">View trace →</button>
          `;
        } else if (data.status === 'blocked') {
          resultEl.innerHTML = `<div id="chat-error">Request blocked (${escapeHtml(data.blocked_at)}): ${escapeHtml(data.reason)}</div>`;
        } else {
          resultEl.innerHTML = `<div id="chat-error">An error occurred. Check the server logs.</div>`;
        }
      } catch (err) {
        statusEl.textContent = '';
        resultEl.style.display = 'block';
        resultEl.innerHTML = `<div id="chat-error">Network error: ${escapeHtml(String(err))}</div>`;
      } finally {
        submitBtn.disabled = false;
      }
    });

    function openTrace(sessionId) {
      switchTab('traces');
      loadSessions().then(() => loadSession(sessionId));
    }

    // ── Traces ────────────────────────────────────────────────────
    const EVENT_COLORS = {
      request_safety_check: 'color-safety',
      response_safety_check: 'color-safety',
      llm_request: 'color-llm',
      llm_response: 'color-llm',
      tool_call: 'color-tool',
      tool_result: 'color-tool',
      error: 'color-error',
      final_answer: 'color-final',
    };

    async function loadSessions() {
      const res = await fetch('/api/traces');
      const sessions = await res.json();
      const list = document.getElementById('session-list');
      if (!sessions.length) {
        list.innerHTML = '<p style="padding:16px;font-size:0.85rem;color:#888;">No sessions yet.</p>';
        return;
      }
      list.innerHTML = sessions.map(s => `
        <div class="session-item" data-id="${s.session_id}" onclick="loadSession('${s.session_id}')">
          <div class="session-id">${s.session_id.slice(0, 16)}…
            <span class="badge badge-${s.status}">${s.status}</span>
          </div>
          <div class="session-meta">
            ${new Date(s.started_at).toLocaleString()} &bull;
            ${s.total_duration_ms != null ? s.total_duration_ms + 'ms' : '—'} &bull;
            ${s.total_usage ? (s.total_usage.input_tokens + s.total_usage.output_tokens) + ' tok' : '—'}
          </div>
        </div>
      `).join('');
    }

    async function loadSession(sessionId) {
      document.querySelectorAll('.session-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.session-item[data-id="${sessionId}"]`);
      if (el) el.classList.add('active');

      const res = await fetch(`/api/traces/${sessionId}`);
      if (!res.ok) { alert('Session not found'); return; }
      renderSession(await res.json());
    }

    function renderSession(session) {
      const turns = new Set(session.events.filter(e => e.turn).map(e => e.turn)).size;
      document.getElementById('trace-view').innerHTML = `
        <div id="summary">
          <div class="summary-item"><div class="summary-label">Status</div><div class="summary-value">${session.status}</div></div>
          <div class="summary-item"><div class="summary-label">Duration</div><div class="summary-value">${session.total_duration_ms ?? '—'}ms</div></div>
          <div class="summary-item"><div class="summary-label">Turns</div><div class="summary-value">${turns}</div></div>
          <div class="summary-item"><div class="summary-label">Input tokens</div><div class="summary-value">${session.total_usage?.input_tokens ?? '—'}</div></div>
          <div class="summary-item"><div class="summary-label">Output tokens</div><div class="summary-value">${session.total_usage?.output_tokens ?? '—'}</div></div>
        </div>
        <div style="margin-bottom:16px;font-size:0.9rem;"><strong>Query:</strong> ${escapeHtml(session.user_query)}</div>
        ${session.events.map((ev, i) => renderEvent(ev, i)).join('')}
      `;
    }

    function renderEvent(ev, idx) {
      const color = EVENT_COLORS[ev.event] || 'color-final';
      const turn = ev.turn ? `<span class="event-turn">turn ${ev.turn}</span>` : '';
      const dur = ev.duration_ms != null ? `<span class="duration-badge">${ev.duration_ms}ms</span>` : '';
      const ts = ev.timestamp ? `<span class="event-ts">${new Date(ev.timestamp).toLocaleTimeString()}</span>` : '';
      return `
        <div class="event-card ${color}">
          <div class="event-header" onclick="toggleEvent(${idx})">
            <span class="event-name">${ev.event}</span>${turn}${dur}${ts}
          </div>
          <div class="event-body" id="ev-${idx}">
            <span class="toggle-raw" onclick="event.stopPropagation();toggleRaw(${idx})">▶ raw JSON</span>
            <pre id="raw-${idx}" style="display:none;">${escapeHtml(JSON.stringify(ev, null, 2))}</pre>
          </div>
        </div>`;
    }

    function toggleEvent(idx) {
      document.getElementById(`ev-${idx}`).classList.toggle('open');
    }

    function toggleRaw(idx) {
      const raw = document.getElementById(`raw-${idx}`);
      const toggler = raw.previousElementSibling;
      const open = raw.style.display === 'none';
      raw.style.display = open ? 'block' : 'none';
      toggler.textContent = open ? '▼ raw JSON' : '▶ raw JSON';
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── Evals ─────────────────────────────────────────────────────
    const JUDGE_LABELS = {
      tool_routing: 'Tool Routing',
      factual_accuracy: 'Factual Accuracy',
      hallucination: 'Hallucination',
      format: 'Format',
      guardrail: 'Guardrail',
    };

    async function loadEvalRuns() {
      const res = await fetch('/api/evals');
      const runs = await res.json();
      const list = document.getElementById('run-list');
      if (!runs.length) {
        list.innerHTML = '<p style="padding:16px;font-size:0.85rem;color:#888;">No eval runs yet.</p>';
        return;
      }
      list.innerHTML = runs.map(r => {
        const rate = Math.round(r.passed / r.total * 100);
        const badgeCls = r.failed === 0 ? 'badge-pass' : 'badge-fail';
        return `
          <div class="run-item" data-id="${r.run_id}" onclick="loadEvalRun('${r.run_id}')">
            <div class="run-id">${r.run_id}
              <span class="badge ${badgeCls}">${rate}%</span>
            </div>
            <div class="run-meta">${new Date(r.ran_at).toLocaleString()} &bull; ${r.passed}/${r.total} passed</div>
          </div>`;
      }).join('');
    }

    async function loadEvalRun(runId) {
      document.querySelectorAll('.run-item').forEach(el => el.classList.remove('active'));
      const el = document.querySelector(`.run-item[data-id="${runId}"]`);
      if (el) el.classList.add('active');

      const res = await fetch(`/api/evals/${runId}`);
      if (!res.ok) { alert('Eval run not found'); return; }
      renderEvalRun(await res.json());
    }

    function renderEvalRun(run) {
      const s = run.summary;
      const rate = Math.round(s.passed / s.total * 100);

      const judgeRows = Object.entries(JUDGE_LABELS).map(([key, label]) => {
        const j = s.by_judge[key];
        const pct = Math.round(j.passed / s.total * 100);
        return `
          <div class="judge-cell">
            <div class="judge-cell-name">${label}</div>
            <div class="judge-cell-stat">${j.passed}/${s.total} <span style="color:#888;font-weight:400;">(${pct}%)</span></div>
          </div>`;
      }).join('');

      const caseCards = run.cases.map((c, idx) => renderCaseCard(c, idx)).join('');

      document.getElementById('evals-view').innerHTML = `
        <div class="run-summary">
          <div class="run-summary-top">
            <div class="summary-item"><div class="summary-label">Run</div><div class="summary-value" style="font-family:monospace;font-size:0.85rem;">${run.run_id}</div></div>
            <div class="summary-item"><div class="summary-label">Total</div><div class="summary-value">${s.total}</div></div>
            <div class="summary-item"><div class="summary-label">Passed</div><div class="summary-value" style="color:#155724;">${s.passed}</div></div>
            <div class="summary-item"><div class="summary-label">Failed</div><div class="summary-value" style="color:#721c24;">${s.failed}</div></div>
            <div class="summary-item"><div class="summary-label">Pass rate</div><div class="summary-value">${rate}%</div></div>
          </div>
          <div class="judge-table">${judgeRows}</div>
        </div>
        ${caseCards}
      `;
    }

    function renderCaseCard(c, idx) {
      const verdictCls = c.verdict === 'pass' ? 'verdict-pass' : 'verdict-fail';
      const badge = `<span class="badge ${c.verdict === 'pass' ? 'badge-pass' : 'badge-fail'}">${c.verdict.toUpperCase()}</span>`;
      const failedJudges = Object.entries(c.judges)
        .filter(([, j]) => j.verdict === 'fail')
        .map(([name]) => JUDGE_LABELS[name] || name)
        .join(', ');
      const failureHint = failedJudges ? `<span class="case-failures">${failedJudges} ✗</span>` : '';
      const queryShort = c.query.length > 70 ? c.query.slice(0, 70) + '…' : c.query;

      const judgeSections = Object.entries(JUDGE_LABELS).map(([key, label]) => {
        const j = c.judges[key];
        if (!j) return '';
        const jBadge = `<span class="badge ${j.verdict === 'pass' ? 'badge-pass' : 'badge-fail'}">${j.verdict.toUpperCase()}</span>`;
        const rubrics = j.rubrics.map(r => `
          <div class="rubric-row">
            <span class="rubric-name">${r.name}</span>
            <span class="rubric-chip ${r.passed ? 'chip-pass' : 'chip-fail'}">${r.passed ? 'PASS' : 'FAIL'}</span>
            <span class="rubric-reason">${escapeHtml(r.reason)}</span>
          </div>`).join('');
        return `
          <div class="judge-section">
            <div class="judge-section-header">${label} ${jBadge}</div>
            ${rubrics}
          </div>`;
      }).join('');

      const hasResponse = c.agent_response && c.agent_response.length > 0;
      const responseBlock = hasResponse ? `
        <span class="agent-response-toggle" onclick="toggleAgentResponse(${idx})">▶ agent response</span>
        <div class="agent-response-box" id="ar-${idx}">${escapeHtml(c.agent_response)}</div>` : '';

      return `
        <div class="case-card ${verdictCls}">
          <div class="case-header" onclick="toggleCase(${idx})">
            <span class="case-id">${c.id}</span>
            <span class="case-query">${escapeHtml(queryShort)}</span>
            ${failureHint}
            ${badge}
          </div>
          <div class="case-body" id="case-${idx}">
            ${responseBlock}
            ${judgeSections}
          </div>
        </div>`;
    }

    function toggleCase(idx) {
      document.getElementById(`case-${idx}`).classList.toggle('open');
    }

    function toggleAgentResponse(idx) {
      const box = document.getElementById(`ar-${idx}`);
      const toggle = box.previousElementSibling;
      const open = box.style.display !== 'block';
      box.style.display = open ? 'block' : 'none';
      toggle.textContent = open ? '▼ agent response' : '▶ agent response';
    }
  </script>
</body>
</html>
